const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const tabs = document.getElementById("tabs"), view = document.getElementById("view");
const all = { id: "tumu", name: "Tümü" }, refTab = { id: "kaynaklar", name: `Gerçek örnekler (${REFS.length})` };
[all, refTab, ...ORDER].forEach((it, i, arr) => {
  if (it.g && arr[i - 1].g !== it.g) { const l = document.createElement("span"); l.className = "glabel"; l.textContent = it.g; tabs.append(l); }
  const b = document.createElement("button");
  b.id = "tab-" + it.id; b.role = "tab"; b.dataset.id = it.id;
  b.textContent = it.n ? `${String(it.n).padStart(2, "0")} · ${it.name}` : it.name;
  b.onclick = () => show(it.id);
  tabs.append(b);
});

function show(id) {
  if (id === "kaynaklar") {
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
    const groups = [...new Set(REFS.map(x => x.group))];
    view.innerHTML = `<p class="sub" style="margin:0 0 6px">İnternetten bulunmuş ${REFS.length} gerçek örnek. Bağlantılar yeni sekmede açılır.</p>` + groups.map(g => `<h2 class="gh">${g}</h2><div class="refs">${REFS.filter(x => x.group === g).map(x => `
      <a class="ref" href="${x.url}" target="_blank" rel="noopener"><span class="rsrc">${esc(x.source)}</span><b>${esc(x.title)}</b><span class="rchip">${esc(x.style)}</span><span class="rwhy">${esc(x.why)}</span><span class="rgo">Aç ↗</span></a>`).join("")}</div>`).join("");
    document.getElementById("tab-kaynaklar").scrollIntoView({ block: "nearest", inline: "nearest" });
    return;
  }
  const it = ITEMS.find(x => x.id === id);
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === (it ? id : "tumu")));
  if (it) {
    view.innerHTML = `<div class="stage"><img src="${it.src}" alt="Örnek ${it.n}: ${it.name}">
      <div class="cap"><span><b>${String(it.n).padStart(2, "0")} · ${it.name}</b> — ${it.desc}</span><span>Örnek veri</span></div></div>`;
  } else {
    view.innerHTML = ["Görsel ağırlıklı", "Veri ağırlıklı"].map(g => `<h2 class="gh">${g}</h2><div class="grid">${ITEMS.filter(x => x.g === g).map(x => `<button data-id="${x.id}"><img src="${x.src}" alt="" loading="lazy"><span>${String(x.n).padStart(2, "0")} · ${x.name}</span></button>`).join("")}</div>`).join("");
    view.querySelectorAll(".grid button").forEach(b => b.onclick = () => { show(b.dataset.id); window.scrollTo(0, 0); });
  }
  document.getElementById("tab-" + (it ? id : "tumu")).scrollIntoView({ block: "nearest", inline: "nearest" });
}
const h = location.hash.slice(1);
show(ITEMS.some(x => x.id === h) || h === "kaynaklar" ? h : "tumu");
</script>
